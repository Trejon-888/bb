name: Compare server plugin test setup
on:
  push:
    branches: [bb/benchmark-ci-server-plugin-startup]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        order: [baseline-first, candidate-first]
        group: [linux-2, windows-2, windows-3]
        include:
          - group: linux-2
            runner: blacksmith-4vcpu-ubuntu-2404
            shard: 2/2
            workers: '4'
          - group: windows-2
            runner: blacksmith-4vcpu-windows-2025
            shard: 2/3
            workers: ''
          - group: windows-3
            runner: blacksmith-4vcpu-windows-2025
            shard: 3/3
            workers: ''
    env:
      BB_CI_TEST_SHARD: ${{ matrix.shard }}
      VITEST_MAX_WORKERS: ${{ matrix.workers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - uses: ./.github/actions/windows-dependency-cache
        if: runner.os == 'Windows'
        continue-on-error: true
      - name: Install dependencies
        shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'
      - name: Warm the full shard and prerequisites on Windows
        if: runner.os == 'Windows'
        shell: cmd
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          if not exist "%RUNNER_TEMP%\server-plugin-results" mkdir "%RUNNER_TEMP%\server-plugin-results"
          pnpm exec turbo run test --filter=@bb/server --continue --concurrency=4 --output-logs=full > "%RUNNER_TEMP%\server-plugin-results\warmup.log" 2>&1
      - name: Warm the full shard and prerequisites on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/server-plugin-results"
          pnpm exec turbo run test --filter=@bb/server --continue --concurrency=4 --output-logs=full > "$RUNNER_TEMP/server-plugin-results/warmup.log" 2>&1
      - name: Compare the full shard
        env:
          BENCHMARK_ORDER: ${{ matrix.order }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: node .github/scripts/benchmark-ci-server-plugin-startup.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: server-plugin-${{ matrix.group }}-${{ matrix.order }}
          path: ${{ runner.temp }}/server-plugin-results/
