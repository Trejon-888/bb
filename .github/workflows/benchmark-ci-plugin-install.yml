name: Compare Windows plugin dependency scope
on:
  push:
    branches: [bb/benchmark-ci-plugin-install]
permissions:
  contents: read
jobs:
  compare:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        order: [baseline-first, candidate-first]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - name: Compare independent cold installations
        env:
          BENCHMARK_ORDER: ${{ matrix.order }}
        run: node .github/scripts/benchmark-ci-cold-install.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: plugin-install-${{ matrix.order }}
          path: ${{ runner.temp }}/cold-install-results/
